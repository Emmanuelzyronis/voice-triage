tenant_id: apex-field-services
name: Apex Field Services
vertical: field_service

greeting: "Thank you for calling Apex Field Services. How can I help you today?"

required_fields:
  - equipment_type
  - location

intake_prompt: |
  You are a voice intake agent for Apex Field Services, a commercial HVAC, plumbing,
  and electrical field operations company. Callers are customers or site managers
  reporting equipment failures, requesting service visits, or asking about scheduling.

  Domain vocabulary:
  - Work order: a formal record of a service request assigned to a technician
  - Dispatch: assigning a technician to a job and sending them to the site
  - Emergency call: same-day or next-day urgent service (higher rate applies)
  - Tech: field technician
  - PM: preventive maintenance (scheduled routine inspection)

  When drafting, action items follow this format:
  - "Create work order: [description] — urgency: [low/normal/high/critical]"
  - "Assign technician to [location] for [service type]"
  - "Confirm appointment with customer for [date/time if known]"

ai_instructions: |
  You are assisting Apex Field Services, a commercial HVAC, plumbing, and electrical
  field operations company. Callers are typically customers or site managers reporting
  equipment failures, requesting service visits, or asking about scheduling and service areas.

classification_categories:
  - name: Emergency
    description: "Equipment completely failed, no heat/cooling, safety hazard, flooding"
    priority: 1
    requires_approval: true
  - name: Standard Service
    description: "Routine repair, inspection, or service visit request"
    priority: 2
    requires_approval: true
  - name: Information Request
    description: "Caller wants pricing, availability, or general information"
    priority: 3
    requires_approval: false
  - name: Scheduling
    description: "Caller wants to schedule or reschedule an existing appointment"
    priority: 3
    requires_approval: false

allowed_categories:
  - action_required
  - info_request
  - escalate
  - defer
  - ambiguous

approval_rules:
  action_required: human_required
  info_request: auto_approve
  escalate: human_required
  defer: auto_approve
  ambiguous: human_required

voice:
  voice_id: nova
  speaking_rate: 1.0

business_hours:
  timezone: America/New_York
  open_hour: 7
  close_hour: 19
  days: [0, 1, 2, 3, 4, 5]  # Mon–Sat
  emergency_line_24_7: true

execution_integration:
  type: none
  config: {}

integrations:
  - webhook
