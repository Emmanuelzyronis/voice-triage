[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-triage"
version = "0.1.0"
description = "Voice-supervised agentic pipeline with human approval gate"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "assemblyai>=0.35.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "langgraph>=1.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "openai>=1.0",
    "chromadb>=0.5",
    "websockets>=13.0",
    "httpx>=0.27",
    "structlog>=24.0",
]

[project.optional-dependencies]
mic = ["pyaudio>=0.2.14"]   # local mic testing only — not needed for web deployment
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
